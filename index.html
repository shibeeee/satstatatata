<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SatStat · Free SAT Prep</title>
  <meta name="description" content="A free SAT prep dashboard: practice questions, timed mock exams, vocab flashcards, diagnostics and a study schedule.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn" id="menu" aria-label="Open menu">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a class="brand" href="#/home"><span class="logo">S</span><span>SatStat</span></a>
    </header>

    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/home"><span class="logo">S</span><span class="label">SatStat</span></a>
      <nav class="nav">
        <a href="#/home" data-route="home">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span class="label">Home</span>
        </a>
        <a href="#/practice" data-route="practice">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span class="label">Practice</span>
        </a>
        <a href="#/exams" data-route="exams">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="label">Mock exams</span>
        </a>
        <a href="#/vocab" data-route="vocab">
          <svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/><path d="M8 7h7"/></svg><span class="label">Vocab</span>
        </a>
        <a href="#/diagnostics" data-route="diagnostics">
          <svg viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-7M3 20h18"/></svg><span class="label">Diagnostics</span>
        </a>
        <a href="#/schedule" data-route="schedule">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="label">Schedule</span>
        </a>
        <a href="#/settings" data-route="settings">
          <svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span class="label">Settings</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <span class="free-badge label">100% free</span>
        <button class="collapse" id="collapse" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span class="label">Collapse</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main id="main" tabindex="-1"></main>
  </div>

  <script src="js/questions.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
